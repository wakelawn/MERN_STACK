<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Booking Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">Logo</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
        <div class="user-actions">
            <span class="username">JohnDoe</span>
            <button class="logout-btn">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <!-- Left Section: Cart & Booking -->
        <section class="left-section">
            <div class="cart">
                <h2>Your Cart</h2>
                <div id="cart-items" class="cart-items">
                    <p>No items have been added yet.</p>
                </div>
                <div class="cart-total">
                    Total: <span id="total-amount">$0.00</span>
                </div>
            </div>

            <div class="booking-form">
                <h2>Book Now</h2>
                <form id="bookingForm">
                    <input type="text" placeholder="Full Name" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Book Now</button>
                </form>
            </div>
        </section>

        <!-- Right Section: Browse Services -->
        <section class="right-section">
            <header class="section-header">
                <h2>Browse Our Services</h2>
                <p>Choose from our premium services below.</p>
            </header>

            <div class="service-grid" id="serviceGrid">
                <!-- Services will be injected via JS -->
            </div>

            <div class="cart-options">
                <p>Click "Add Item" on any service to add it to your cart.</p>
                <button id="generalAddToCart">Add to Cart</button>
                <button id="generalBookNow">Book Now</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
